# cjt-casamia — Midnight Commander skin in the zsh prompt / screen palette (256 colours)
# Selected with MC_SKIN=cjt-casamia in ~/.zshrc. Colours: fg;bg as colorNNN.
[skin]
    description = cjt-casamia: muted dark, blue-grey selection, sage/amber accents
    256colors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = color250;color235
    selected = color195;color23
    marked = color179;color235
    markselect = color222;color23
    gauge = color235;color108
    input = color252;color237
    inputmark = color195;color23
    inputunchanged = color245;color237
    commandlinemark = color195;color23
    reverse = color235;color250
    header = color109;color235
    inputhistory = color250;color237
    commandhistory = color250;color237
    shadow = color240;color232
    frame = color240;color235
    disabled = color243;color236

[dialog]
    _default_ = color252;color236
    dfocus = color195;color23
    dhotnormal = color180;color236
    dhotfocus = color222;color23
    dselnormal = color195;color23
    dselfocus = color195;color24
    dtitle = color109;color236
    dframe = color240;color236

[error]
    _default_ = color224;color52
    errdfocus = color232;color217
    errdhotnormal = color222;color52
    errdhotfocus = color52;color217
    errdtitle = color231;color52
    errdframe = color217;color52

[filehighlight]
    directory = color110;
    executable = color108;
    symlink = color140;
    hardlink = color140;
    stalelink = color167;
    device = color175;
    special = color175;
    core = color167;
    temp = color243;
    archive = color179;
    doc = color180;
    source = color152;
    media = color175;
    graph = color139;
    database = color144;

[menu]
    _default_ = color250;color236
    menusel = color195;color23
    menuhot = color180;color236
    menuhotsel = color222;color23
    menuinactive = color245;color236
    menuframe = color240;color236

[popupmenu]
    _default_ = color250;color236
    menusel = color195;color23
    menutitle = color109;color236
    menuframe = color240;color236

[buttonbar]
    hotkey = color180;color235
    button = color245;color236

[statusbar]
    _default_ = color245;color236

[help]
    _default_ = color250;color236
    helpitalic = color140;color236
    helpbold = color180;color236
    helpslink = color195;color23
    helplink = color110;color236
    helpnormal = color250;color236
    helptitle = color109;color236
    helpframe = color240;color236

[editor]
    _default_ = color250;color235
    editbold = color222;color235
    editmarked = color195;color23
    editwhitespace = color238;color235
    editnonprintable = color167;color235
    editlinestate = color243;color236
    bookmark = color231;color24
    bookmarkfound = color232;color108
    editrightmargin = color238;color235
    editframe = color240;color235
    editframeactive = color110;color235
    editframedrag = color179;color235

[viewer]
    _default_ = color250;color235
    viewbold = color222;color235
    viewunderline = color110;color235
    viewselected = color195;color23

[diffviewer]
    added = color232;color108
    changedline = color250;color237
    changednew = color232;color179
    changed = color250;color238
    removed = color232;color167
    error = color224;color52

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ←
    history-next-item-char = →
    history-show-list-char = ↓
    filename-scroll-left-char = «
    filename-scroll-right-char = »

[widget-scollbar]
    first-vert-char = ↑
    last-vert-char = ↓
    first-horiz-char = «
    last-horiz-char = »
    current-char = ■
    background-char = ▒
