# ~/.tmux.conf - managed by cjt-casamia (edit with: cjt-casamia edit ~/.tmux.conf)
# Same muted palette as the zsh prompt, screen and mc.

# --- windows (tabs) ---
bind -r < swap-window -d -t -1      # Ctrl-b <  move window left (repeatable)
bind -r > swap-window -d -t +1      # Ctrl-b >  move window right
set -g renumber-windows on          # no gaps after closing a window
set -g allow-rename off             # names you give stay; programs can't overwrite them
set -g base-index 1                 # windows start at 1, matching the keyboard
setw -g pane-base-index 1
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- terminal ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g escape-time 10
set -g mouse on                     # click windows/panes, scroll with the wheel

# --- status bar: host | windows ........ up . ip . date time ---
set -g status-interval 60
set -g status-style "fg=colour250,bg=colour235"
set -g status-left-length 40
set -g status-left "#[fg=colour180,bg=colour236] #h #[default] "
set -g status-right-length 80
set -g status-right "#[fg=colour243]up #[fg=colour109]#(cjt-statusinfo uptime)  #[fg=colour243]ip #[fg=colour140]#(cjt-statusinfo ip)  #[fg=colour245]%a %d %b #[fg=colour250]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=colour195,bg=colour23] #I #W "
setw -g window-status-separator ""

# --- panes, messages, copy mode ---
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour109"
set -g message-style "fg=colour195,bg=colour23"
setw -g mode-style "fg=colour195,bg=colour23"
